<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>San Bernardo vs Rete</title>
<style>
:root{
  --bg:#0a0f1d;--panel:#11182a;--panel2:#0d1525;--line:#263452;--ink:#f4f7ff;--muted:#9aa8bf;
  --cyan:#55d8ff;--green:#68e39b;--gold:#ffd166;--red:#ff7b8c;--road:#2b3347;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:
  radial-gradient(circle at 12% 8%,rgba(85,216,255,.09),transparent 28%),
  radial-gradient(circle at 88% 0%,rgba(104,227,155,.07),transparent 24%),var(--bg);
  min-height:100vh
}
.wrap{max-width:1180px;margin:auto;padding:24px 20px 34px}
header{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:16px}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:900}
h1{margin:5px 0 0;font-size:clamp(2.1rem,5vw,3.6rem);line-height:.95;letter-spacing:-.05em}
.header-note{max-width:430px;color:var(--muted);font-size:.9rem;line-height:1.35;text-align:right}
.grid{display:grid;grid-template-columns:275px 1fr;gap:16px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.008)),var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.controls{padding:16px}
.controls h2,.calc h2{margin:0 0 13px;font-size:.98rem}
.field{padding:11px 0 13px;border-bottom:1px solid rgba(38,52,82,.7)}
.field:last-of-type{border-bottom:0}
.field label{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:.82rem}
.value{font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--cyan);cursor:pointer}
.field-error{height:0;color:var(--red);font-size:.7rem;overflow:hidden}
.field-error.show{height:auto;margin-top:4px}
.invalid{accent-color:var(--red)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid transparent;background:#18243d;color:var(--ink);padding:9px 11px;border-radius:10px;cursor:pointer;font-weight:850;transition:transform .12s,filter .12s,opacity .12s}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(1px)}button:disabled{opacity:.35;cursor:not-allowed;filter:none}
.primary{width:100%;margin-top:12px;padding:12px;background:linear-gradient(180deg,#45d5fb,#28aedd);color:#06101d;box-shadow:0 10px 24px rgba(40,174,221,.22)}
.game{overflow:hidden}
.game-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px 12px}
.game-head h2{margin:0;font-size:1rem}.game-head small{display:block;margin-top:3px;color:var(--muted);font-size:.75rem}
.badge{padding:6px 9px;border-radius:999px;background:#17223a;border:1px solid var(--line);color:var(--muted);font-size:.7rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.badge.cane{background:var(--green);color:#06151e;border-color:transparent}.badge.rete{background:var(--gold);color:#1d1300;border-color:transparent}.badge.tie{background:#d6dce7;color:#10131a;border-color:transparent}
.stage{position:relative;min-height:390px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(#10182a 0 53%,#142e22 53% 100%)}
.sky{position:absolute;inset:0 0 47% 0;background:linear-gradient(#0d1426,#132039)}
.cloud{position:absolute;width:90px;height:24px;border-radius:999px;background:rgba(255,255,255,.08)}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:34px;height:34px;left:18px;top:-17px}.cloud:after{width:48px;height:48px;left:45px;top:-23px}
.c1{left:9%;top:12%}.c2{right:12%;top:20%;transform:scale(.7)}
.sun{position:absolute;right:8%;top:9%;width:62px;height:62px;border-radius:50%;background:#ffd873;box-shadow:0 0 35px rgba(255,216,115,.24)}
.lane{position:absolute;left:22px;right:22px;height:126px}.internet{top:42px}.dog{bottom:36px}
.lane-head{position:absolute;left:0;top:-28px;display:flex;align-items:baseline;gap:8px}.lane-title{font-size:.83rem;font-weight:900;letter-spacing:.02em}.lane-note{font-size:.68rem;color:var(--muted)}
.track{position:absolute;left:68px;right:84px;top:47px;height:9px;border-radius:999px;background:#25314b;border:1px solid rgba(255,255,255,.07)}
.dog .track{top:29px;height:47px;border-radius:11px;background:var(--road);border-bottom:7px solid #1e2738}
.mark{position:absolute;top:-5px;width:2px;height:19px;background:#55627d;opacity:.55}.m1{left:25%}.m2{left:50%}.m3{left:75%}
.endpoint{position:absolute;top:-14px;width:1px;height:38px;border-left:2px dashed #71809d}.start{left:0}.finish{right:0}
.endpoint-label{position:absolute;top:26px;color:#9ba8bf;font-size:.62rem}.start .endpoint-label{left:0}.finish .endpoint-label{right:0;transform:translateX(100%)}
#packets{position:absolute;inset:0}
.packet{position:absolute;top:-10px;left:0;width:25px;height:25px;border-radius:6px;background:var(--cyan);border:1px solid rgba(255,255,255,.35);box-shadow:0 0 16px rgba(85,216,255,.38);display:grid;place-items:center;color:#041018;font-size:.55rem;font-weight:950;will-change:transform,opacity}
.packet:before{content:"";width:9px;height:9px;border-radius:2px;background:#0d2e3b;opacity:.55}
.receiver{position:absolute;right:-72px;top:-22px;width:65px;text-align:center}
.receiver-label{font-size:.62rem;color:#9ba8bf;margin-bottom:5px}.receiver-box{height:17px;border-radius:999px;background:#18253d;border:1px solid rgba(255,255,255,.08);overflow:hidden}.receiver-box span{display:block;height:100%;width:0%;background:var(--cyan);box-shadow:0 0 13px rgba(85,216,255,.5)}
.receiver.done .receiver-box span{background:var(--green)}
.receiver-pct{margin-top:3px;font-size:.61rem;font-weight:900;color:#dfe7f3;font-variant-numeric:tabular-nums}
.finish-flag{position:absolute;right:-15px;top:-5px;width:34px;height:50px}.finish-flag:before{content:"";position:absolute;left:8px;top:0;width:3px;height:50px;background:#dfe6f3}.finish-flag:after{content:"";position:absolute;left:11px;top:4px;width:18px;height:14px;background:repeating-linear-gradient(45deg,#f4f7ff 0 5px,#303b55 5px 10px)}
.dog-wrap{position:absolute;left:0;bottom:-21px;width:120px;height:76px;overflow:visible;transform:translateX(0);pointer-events:none;will-change:left}
.dog-window{position:absolute;left:0;bottom:0;width:120px;height:76px;overflow:hidden;image-rendering:pixelated}.dog-sheet{position:absolute;left:26px;bottom:5px;width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;max-width:none}
.dog-window.running .dog-sheet{animation:dogBob .42s steps(2) infinite}.dog-window.idle .dog-sheet{animation:none}.fallback-dog{display:none;position:absolute;left:28px;bottom:0;font-size:56px;line-height:70px}.dog-window.failed .fallback-dog{display:block}
@keyframes dogBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.playback{display:flex;gap:7px;align-items:center;padding:10px 14px;background:#0d1426;border-bottom:1px solid var(--line)}
.playback button{min-width:88px}.step-counter{margin-left:auto;color:#8491aa;font-size:.72rem;font-weight:900}
.timeline{padding:12px 15px 14px}.timeline-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}.timeline-bar{height:7px;background:#202c46;border-radius:999px;overflow:hidden;margin-top:7px}.timeline-bar span{display:block;width:0;height:100%;background:var(--cyan)}
.calc{margin-top:14px;padding:15px}.calc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.step-dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#25324d}.dot.active{background:var(--cyan);box-shadow:0 0 0 4px rgba(85,216,255,.1)}
.step-card{min-height:130px;padding:15px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.step-kicker{font-size:.68rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.09em;font-weight:900}.step-title{font-size:1.08rem;font-weight:950;margin-top:3px}.step-body{margin-top:6px;color:#c9d3e4;font-size:.84rem;line-height:1.4}.formula{margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1rem;font-weight:900}.formula .hot{color:var(--cyan)}
.result{margin-top:9px;min-height:20px;font-size:.84rem;font-weight:900}.muted{color:var(--muted);font-weight:700}
@media(max-width:900px){.grid{grid-template-columns:1fr}.controls{order:2}.game{order:1}}
@media(max-width:620px){header{display:block}.header-note{text-align:left;margin-top:9px}.stage{min-height:415px}.lane{left:12px;right:12px}.track{left:58px;right:72px}.receiver{right:-3px}.playback{flex-wrap:wrap}.step-counter{width:100%;margin-left:0}.playback button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="eyebrow">Mini-game</div><h1>San Bernardo vs Rete</h1></div>
  <div class="header-note">Segui il calcolo. Usa Avanti, Indietro e Pausa.</div>
</header>
<div class="grid">
<aside class="panel controls">
  <h2>Parametri</h2>
  <div class="field"><label><span>Dati</span><span class="value" id="dataOut">8.000 Gbit</span></label><input id="dataRange" type="range" min="100" max="50000" step="100" value="8000"><div class="field-error" id="dataError"></div></div>
  <div class="field"><label><span>Distanza</span><span class="value" id="distOut">10 km</span></label><input id="distRange" type="range" min="1" max="500" step="0.1" value="10"><div class="field-error" id="distError"></div></div>
  <div class="field"><label><span>Cane</span><span class="value" id="dogOut">5 km/h</span></label><input id="dogRange" type="range" min="1" max="20" step="0.1" value="5"><div class="field-error" id="dogError"></div></div>
  <div class="field"><label><span>Rete</span><span class="value" id="netOut">1 Gbit/s</span></label><input id="netRange" type="range" min="0.1" max="100" step="0.1" value="1"><div class="field-error" id="netError"></div></div>
  <div class="presets"><button data-preset="base">Base</button><button data-preset="soglia">Soglia</button><button data-preset="lontano">100 km</button></div>
  <button class="primary" id="startBtn">▶ Parti</button>
</aside>
<main>
<section class="panel game">
  <div class="game-head"><div><h2>La gara</h2><small>Il tempo è compresso.</small></div><div class="badge" id="resultBadge">Pronto</div></div>
  <div class="stage">
    <div class="sky"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div>
    <div class="lane internet">
      <div class="lane-head"><div class="lane-title">🌐 RETE</div><div class="lane-note">pacchetti</div></div>
      <div class="track" id="netTrack">
        <div class="endpoint start"><span class="endpoint-label">A</span></div><div class="endpoint finish"><span class="endpoint-label">B</span></div>
        <div class="mark m1"></div><div class="mark m2"></div><div class="mark m3"></div><div id="packets"></div>
        <div class="receiver" id="receiver"><div class="receiver-label">Ricezione</div><div class="receiver-box"><span id="arrivalBar"></span></div><div class="receiver-pct" id="arrivalCount">0%</div></div>
      </div>
    </div>
    <div class="lane dog">
      <div class="lane-head"><div class="lane-title">🐕 SAN BERNARDO</div><div class="lane-note">tutto il carico</div></div>
      <div class="track" id="dogTrack">
        <div class="endpoint start"><span class="endpoint-label">A</span></div><div class="endpoint finish"><span class="endpoint-label">B</span></div>
        <div class="mark m1"></div><div class="mark m2"></div><div class="mark m3"></div><div class="finish-flag"></div>
        <div class="dog-wrap" id="dogWrap"><div class="dog-window running" id="dogWindow"><img class="dog-sheet" id="dogSheet" alt="San Bernardo in pixel art"><div class="fallback-dog">🐕</div></div></div>
      </div>
    </div>
  </div>
  <div class="playback"><button id="backBtn">← Indietro</button><button id="pauseBtn">Ⅱ Pausa</button><button id="nextBtn">Avanti →</button><div class="step-counter" id="stepCounter">1 / 4</div></div>
  <div class="timeline"><div class="timeline-top"><span>Simulazione</span><span id="simTime">0%</span></div><div class="timeline-bar"><span id="simBar"></span></div></div>
</section>
<section class="panel calc">
  <div class="calc-top"><h2>Calcolo</h2><div class="step-dots"><span class="dot active" data-step-dot="0"></span><span class="dot" data-step-dot="1"></span><span class="dot" data-step-dot="2"></span><span class="dot" data-step-dot="3"></span></div></div>
  <div class="step-card" id="stepCard"></div>
  <div class="result" id="resultLine"></div>
</section>
</main>
</div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = {
    dataRange:$('dataRange'),distRange:$('distRange'),dogRange:$('dogRange'),netRange:$('netRange'),
    dataOut:$('dataOut'),distOut:$('distOut'),dogOut:$('dogOut'),netOut:$('netOut'),
    dataError:$('dataError'),distError:$('distError'),dogError:$('dogError'),netError:$('netError'),
    netTrack:$('netTrack'),dogTrack:$('dogTrack'),packets:$('packets'),receiver:$('receiver'),arrivalBar:$('arrivalBar'),arrivalCount:$('arrivalCount'),
    dogWrap:$('dogWrap'),dogWindow:$('dogWindow'),dogSheet:$('dogSheet'),resultBadge:$('resultBadge'),
    startBtn:$('startBtn'),backBtn:$('backBtn'),pauseBtn:$('pauseBtn'),nextBtn:$('nextBtn'),stepCounter:$('stepCounter'),
    simTime:$('simTime'),simBar:$('simBar'),stepCard:$('stepCard'),resultLine:$('resultLine')
  };

  const DOG_SPRITE = 'https://opengameart.org/sites/default/files/cao_pixel_final_64_0.png';
  els.dogSheet.src = DOG_SPRITE;
  els.dogSheet.addEventListener('error', () => els.dogWindow.classList.add('failed'));

  const rules = {
    dataRange:{min:100,max:50000,error:els.dataError,label:'Dati'},
    distRange:{min:1,max:500,error:els.distError,label:'Distanza'},
    dogRange:{min:1,max:20,error:els.dogError,label:'Cane'},
    netRange:{min:.1,max:100,error:els.netError,label:'Rete'}
  };

  const PACKET_PLANS = [
    [0.00,0.34],[0.07,0.29],[0.15,0.36],[0.24,0.27],[0.32,0.33],[0.41,0.30],[0.50,0.35],[0.59,0.28],[0.67,0.32],[0.75,0.25]
  ];
  const STEP_POINTS = [0,.28,.58,1];
  const SIM_MS = 18000;

  let raf=null,lastFrame=0,simProgress=0,step=0,playing=false,model=null;

  const fmt = (n,d=1) => new Intl.NumberFormat('it-IT',{maximumFractionDigits:d}).format(n);
  const timeText = seconds => {
    if(seconds < 60) return `${fmt(seconds,0)} s`;
    const minutes = seconds/60;
    if(minutes < 60) return `${fmt(minutes,0)} min`;
    const hours = minutes/60;
    return `${fmt(hours,1)} h`;
  };

  function state(){
    return {data:Number(els.dataRange.value),distance:Number(els.distRange.value),dog:Number(els.dogRange.value),net:Number(els.netRange.value)};
  }
  function calc(s){
    const net=s.data/s.net;
    const dog=(s.distance/s.dog)*3600;
    return {net,dog,threshold:s.dog*net/3600,max:Math.max(net,dog)};
  }
  function validate(){
    let ok=true;
    Object.entries(rules).forEach(([id,r])=>{
      const v=Number(els[id].value), valid=Number.isFinite(v)&&v>=r.min&&v<=r.max;
      els[id].classList.toggle('invalid',!valid); r.error.textContent=valid?'':`${r.label}: ${fmt(r.min,1)}–${fmt(r.max,1)}`; r.error.classList.toggle('show',!valid); ok&&=valid;
    });
    return ok;
  }
  function travel(){
    return {net:Math.max(0,els.netTrack.clientWidth-25),dog:Math.max(0,els.dogTrack.clientWidth-els.dogWrap.offsetWidth)};
  }
  function makePackets(){
    els.packets.innerHTML='';
    PACKET_PLANS.forEach((_,i)=>{const p=document.createElement('div');p.className='packet';p.setAttribute('aria-hidden','true');p.dataset.i=i;els.packets.appendChild(p);});
  }
  function packetPhase(plan,networkProgress){
    const start=plan[0],duration=plan[1];
    return Math.max(0,Math.min(1,(networkProgress-start)/duration));
  }
  function render(progress){
    if(!model)return;
    const actual=progress*model.max;
    const netProgress=Math.min(1,actual/model.net);
    const dogProgress=Math.min(1,actual/model.dog);
    const w=travel();

    [...els.packets.children].forEach((p,i)=>{
      const ph=packetPhase(PACKET_PLANS[i],netProgress);
      if(ph<=0||ph>=1){p.style.opacity=ph>=1?'0':'0';p.style.transform='translate3d(0,0,0)';return;}
      const y=Math.sin((ph*Math.PI*2)+(i*1.9))*1.4;
      p.style.opacity='1';p.style.transform=`translate3d(${ph*w.net}px,${y}px,0)`;
    });

    const received=Math.round(netProgress*100);
    els.arrivalBar.style.width=`${received}%`;
    els.arrivalCount.textContent=`${received}%`;
    els.receiver.classList.toggle('done',netProgress>=1);

    els.dogWrap.style.left=`${dogProgress*w.dog}px`;
    els.dogWindow.classList.toggle('running',dogProgress<1);
    els.dogWindow.classList.toggle('idle',dogProgress>=1);

    els.simBar.style.width=`${progress*100}%`;
    els.simTime.textContent=`${Math.round(progress*100)}%`;
  }

  function renderStepCard(){
    const s=state(), c=calc(s); model=c;
    const cards=[
      {k:'Passo 1',t:'Partiamo dai dati',b:'La quantità da consegnare è questa.',f:`<span class="hot">${fmt(s.data,0)} Gbit</span>`},
      {k:'Passo 2',t:'La rete divide i dati',b:'Tempo = dati ÷ velocità.',f:`${fmt(s.data,0)} ÷ ${fmt(s.net,1)} = <span class="hot">${timeText(c.net)}</span>`},
      {k:'Passo 3',t:'Il cane percorre la distanza',b:'Tempo = distanza ÷ velocità.',f:`${fmt(s.distance,1)} ÷ ${fmt(s.dog,1)} = <span class="hot">${timeText(c.dog)}</span>`},
      {k:'Passo 4',t:'Confrontiamo i tempi',b:'Sotto la soglia vince il cane. Sopra la soglia vince la rete.',f:`soglia = <span class="hot">${fmt(c.threshold,1)} km</span>`}
    ];
    const card=cards[step];
    els.stepCard.innerHTML=`<div class="step-kicker">${card.k}</div><div class="step-title">${card.t}</div><div class="step-body">${card.b}</div><div class="formula">${card.f}</div>`;
    if(step===3){
      const winner=c.dog===c.net?'tie':c.dog<c.net?'cane':'rete';
      els.resultBadge.className=`badge ${winner}`;
      els.resultBadge.textContent=winner==='tie'?'Pareggio':winner==='cane'?'Vince il cane':'Vince la rete';
      els.resultLine.innerHTML=winner==='tie'?'Arrivano insieme.':winner==='cane'?'Il cane arriva prima.':'La rete arriva prima.';
    }else{
      els.resultBadge.className='badge';els.resultBadge.textContent='In corso';
      els.resultLine.innerHTML='';
    }
  }

  function updateNumbers(){
    const s=state();
    els.dataOut.textContent=`${fmt(s.data,0)} Gbit`;els.distOut.textContent=`${fmt(s.distance,1)} km`;
    els.dogOut.textContent=`${fmt(s.dog,1)} km/h`;els.netOut.textContent=`${fmt(s.net,1)} Gbit/s`;
  }
  function updateDots(){
    document.querySelectorAll('[data-step-dot]').forEach(d=>d.classList.toggle('active',Number(d.dataset.stepDot)===step));
    els.stepCounter.textContent=`${step+1} / 4`;
  }
  function updateButtons(){
    els.backBtn.disabled=step===0&&simProgress<=0;
    els.nextBtn.disabled=step===3&&simProgress>=1;
    els.pauseBtn.textContent=playing?'Ⅱ Pausa':'▶ Riprendi';
  }
  function updateUI(){
    if(!validate())return;
    updateNumbers();renderStepCard();updateDots();updateButtons();render(simProgress);
  }
  function stop(){if(raf)cancelAnimationFrame(raf);raf=null;playing=false;}
  function reset(){stop();simProgress=0;step=0;els.dogWindow.classList.add('running');els.dogWindow.classList.remove('idle');updateUI();}
  function setStep(n){
    step=Math.max(0,Math.min(3,n));simProgress=STEP_POINTS[step];stop();updateUI();
  }
  function frame(now){
    if(!playing)return;
    const dt=now-lastFrame;lastFrame=now;simProgress=Math.min(1,simProgress+dt/SIM_MS);
    step=simProgress<STEP_POINTS[1]?0:simProgress<STEP_POINTS[2]?1:simProgress<1?2:3;
    updateUI();
    if(simProgress<1)raf=requestAnimationFrame(frame);else{stop();updateUI();}
  }
  function start(){
    if(!validate())return;
    stop();simProgress=0;step=0;playing=true;lastFrame=performance.now();updateUI();raf=requestAnimationFrame(frame);
  }
  function togglePause(){
    if(!model)return;
    if(playing){stop();updateUI();return;}
    if(simProgress>=1)simProgress=0;
    playing=true;lastFrame=performance.now();updateUI();raf=requestAnimationFrame(frame);
  }
  function back(){
    stop();
    if(step>0)setStep(step-1);else{simProgress=Math.max(0,simProgress-.1);updateUI();}
  }
  function next(){
    stop();
    if(step<3)setStep(step+1);else{simProgress=Math.min(1,simProgress+.1);updateUI();}
  }

  ['dataRange','distRange','dogRange','netRange'].forEach(id=>els[id].addEventListener('input',reset));
  document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
    const p={base:[8000,10,5,1],soglia:[8000,11.1,5,1],lontano:[8000,100,5,1]}[b.dataset.preset];
    [els.dataRange,els.distRange,els.dogRange,els.netRange].forEach((el,i)=>el.value=p[i]);reset();
  }));
  els.startBtn.addEventListener('click',start);els.pauseBtn.addEventListener('click',togglePause);els.backBtn.addEventListener('click',back);els.nextBtn.addEventListener('click',next);
  window.addEventListener('resize',()=>render(simProgress));
  makePackets();updateUI();render(0);
})();
</script>
</body>
